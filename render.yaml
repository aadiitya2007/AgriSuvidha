services:
  - type: web
    name: agrisuvidha
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: agrisuvidha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true

databases:
  - name: agrisuvidha-db
    plan: free
    region: singapore
    databaseName: agrisuvidha_db
    user: agrisuvidha
