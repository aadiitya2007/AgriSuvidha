<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="AgriSuvidha (एग्री-सुविधा) - Digital Farmer Procurement & Collection Platform by Team Innov8ors for SIH 2026 (SIH26032). Smart slot booking, AI queue prediction, weather forecasting, and instant DBT payments." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>AgriSuvidha (एग्री-सुविधा) | Smart Farmer Procurement Platform</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let r of registrations) {
            r.unregister();
          }
        });
        if (window.caches) {
          caches.keys().then((keys) => {
            for (let k of keys) {
              if (k.includes('krishi')) caches.delete(k);
            }
          });
        }
      }
    </script>
  </body>
</html>
